# The gate at the acceptance boundary: does this change alter a commitment
# in the IZ4, or weaken a test that protects one? Runs the same iz4 gate a
# developer runs locally, from an installation and an allowed-signers list
# the change under review cannot edit. On a pull request it is a required
# check once branch protection says so; on a push to main it can only
# report, since the push has already happened.
name: iz4 gate
on:
  pull_request:
  push:
    branches: [main]
env:
  RAKUPP_VERSION: v5.2.1
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch approvals (detached, outside every tree)
        run: git fetch origin 'refs/iz4/approvals/*:refs/iz4/approvals/*' || true
      - name: Raku++, pinned and checksum-verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RAKUPP_VERSION" -R ash/rakupp -D "$RUNNER_TEMP/dl" -p rakupp-linux-x86_64.tar.gz -p rakupp-linux-x86_64.tar.gz.sha256
          exp=$(grep -o -i '^[0-9a-f]\{64\}' "$RUNNER_TEMP/dl/rakupp-linux-x86_64.tar.gz.sha256")
          got=$(sha256sum "$RUNNER_TEMP/dl/rakupp-linux-x86_64.tar.gz" | awk '{print $1}')
          [ -n "$exp" ] && [ "$exp" = "$got" ] || { echo "checksum mismatch: expected $exp, got $got"; exit 1; }
          mkdir -p "$RUNNER_TEMP/rakupp" && tar xzf "$RUNNER_TEMP/dl/rakupp-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/rakupp"
          RAKUPP=$(find "$RUNNER_TEMP/rakupp" -type f -name rakupp -path '*/bin/*' | head -1)
          [ -n "$RAKUPP" ] || { echo "rakupp not found in the archive"; exit 1; }
          echo "RAKUPP=$RAKUPP" >> "$GITHUB_ENV"
          "$RAKUPP" --version
      - name: iz4 from main, outside the tree under review, run from source under Raku++
        run: |
          git clone --quiet --depth 1 https://github.com/nige123/cli.iz4.you "$RUNNER_TEMP/iz4"
          printf '#!/bin/sh\nexec "%s" -I "%s/lib" "%s/bin/iz4" "$@"\n' "$RAKUPP" "$RUNNER_TEMP/iz4" "$RUNNER_TEMP/iz4" > "$RUNNER_TEMP/iz4-bin"
          chmod +x "$RUNNER_TEMP/iz4-bin"
          "$RUNNER_TEMP/iz4-bin" version
      - name: allowed signers, from a repository variable, never from the tree
        run: |
          printf '%s\n' "${{ vars.IZ4_ALLOWED_SIGNERS }}" > "$RUNNER_TEMP/allowed_signers"
          [ -s "$RUNNER_TEMP/allowed_signers" ] || echo "::warning::IZ4_ALLOWED_SIGNERS is empty: no approval can be accepted here"
      - name: iz4 gate
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            BASE="${{ github.event.before }}"
            case "$BASE" in 0000000000000000000000000000000000000000|'') BASE=none;; esac
          fi
          "$RUNNER_TEMP/iz4-bin" gate --candidate=HEAD --base="$BASE" --enforce --approvers="$RUNNER_TEMP/allowed_signers" \
              --check-cmd="$RAKUPP -I lib {file}"
